services:
  mwyatt-me:
    build:
      context: .
      dockerfile: Dockerfile
    image: mwyatt-me:local
    container_name: mwyatt-me
    restart: unless-stopped
    ports:
      - "8088:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
