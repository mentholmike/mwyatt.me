services:
  mwyatt-me:
    image: ghcr.io/mentholmike/mwyatt-site:latest
    container_name: mwyatt-me
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8088:8080"
    read_only: true
    # nginx-unprivileged needs to write to a few runtime paths. The image's
    # entrypoint creates /tmp/proxy_temp etc. at startup; we mount them as
    # tmpfs so read_only: true still works.
    tmpfs:
      - /tmp:size=64m
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
