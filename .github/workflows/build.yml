name: Build and push image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name kept distinct from the GitHub repo name so the package is
  # a fresh namespace (no collisions with earlier local-push artifacts).
  IMAGE_NAME: ${{ github.repository_owner }}/mwyatt-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The default GITHUB_TOKEN has a known incompatibility with GHCR's OCI
      # blob HEAD on user-scoped packages — even with packages: write, the
      # buildx push step hits a 403 on a config-blob HEAD. A classic PAT
      # works because its token grants the user-scope registry permission.
      # Set CR_PAT as a repo secret (a classic PAT with `write:packages`)
      # to unblock the workflow. Without it, fall back to GITHUB_TOKEN and
      # warn loudly so the failure is obvious.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Generate build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ secrets.CR_PAT != '' }}
          # When CR_PAT isn't set we still want a green ✓ on the build to
          # confirm the Dockerfile works; we just don't push the artifact.
          load: ${{ secrets.CR_PAT == '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Notify when no CR_PAT secret
        if: ${{ secrets.CR_PAT == '' }}
        run: |
          echo "::warning::CR_PAT secret is not set. Build succeeded but no image was pushed to GHCR. Create a classic PAT with \`write:packages\` and add it as a repo secret named \`CR_PAT\` to enable automated image publishing."
