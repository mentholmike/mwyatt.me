name: Build and push image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name kept distinct from the GitHub repo name so the package is
  # a fresh namespace (no collisions with earlier local-push artifacts).
  IMAGE_NAME: ${{ github.repository_owner }}/mwyatt-site

jobs:
  lint:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:check

  build:
    name: Build and push image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The default GITHUB_TOKEN has a known incompatibility with GHCR's OCI
      # blob HEAD on user-scoped packages — even with packages: write, the
      # buildx push step hits a 403 on a config-blob HEAD. A classic PAT
      # works because its token carries the user-scope registry permission.
      # Set CR_PAT as a repo secret (a classic PAT with `write:packages`)
      # to unblock the workflow. Without it, the build is skipped with a
      # clear warning so the failure is obvious.
      - name: Pick registry token
        id: tok
        run: |
          if [ -n "$CR_PAT" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "password=***" >> "$GITHUB_OUTPUT"
            echo "::notice::Using CR_PAT secret for GHCR auth."
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "password=unused" >> "$GITHUB_OUTPUT"
            echo "::warning::CR_PAT is not set — image will not be pushed to GHCR. Create a classic PAT with write:packages and add it as a repo secret named CR_PAT to enable automated image publishing."
          fi
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        if: ${{ steps.tok.outputs.has_pat == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ steps.tok.outputs.password }}

      - name: Generate build metadata
        if: ${{ steps.tok.outputs.has_pat == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: ${{ steps.tok.outputs.has_pat == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
