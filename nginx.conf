# nginx config for mwyatt.me — dark, static, no server-side logic.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Don't bake the listen port into redirects/responses.
    port_in_redirect off;
    server_name_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — mwyatt.me is a static site, be strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Compression for the usual suspects.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cache hashed assets aggressively. Astro emits /_astro/* with content hashes.
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache the OG image and fonts for a year too.
    location ~* ^/(fonts|og-default\.png|favicon\.ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # RSS / sitemap — short cache, allow hot updates.
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Trailing-slash handling: Astro is set to `trailingSlash: ignore`,
    # so we let either form resolve. No rewrite — the file actually exists
    # at the path Astro emitted.

    # Custom 404 falls back to the static 404.html Astro emits.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Default: serve the file if it exists, else 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
